# Local development:
#   docker compose up -d                       → PostgreSQL only (run the
#                                                apps with npm, see README)
# Whole stack in containers:
#   cp .env.example .env   # then set JWT_SECRET
#   docker compose --profile app up -d --build
#   → web app http://localhost:3000, API http://localhost:3001/api

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace_secret}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketplace} -d ${POSTGRES_DB:-marketplace_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applies pending migrations (tracked in schema_migrations), then exits.
  migrate:
    image: postgres:16-alpine
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace_secret}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_db}
    volumes:
      - ./database:/database:ro
    entrypoint: ["bash", "/database/scripts/migrate.sh"]
    restart: "no"

  backend:
    build: ./backend
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace_secret}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_db}
      # Required. The API refuses to start without it.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Public address of the web app, used in password-reset emails.
      APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      # Shared with the frontend so its server-side rendering isn't
      # rate-limited as one guest. Set a long random value.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      # Email (password reset). Without SMTP_HOST, emails are written to
      # the backend log instead of being sent.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${BACKEND_PORT:-3001}:3001"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:3001}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
        BACKEND_INTERNAL_URL: http://backend:3001
    profiles: ["app"]
    restart: unless-stopped
    environment:
      # Used at runtime by server-rendered pages to fetch from the API.
      BACKEND_INTERNAL_URL: http://backend:3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local
